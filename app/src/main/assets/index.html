<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Levi Ackerman · TV Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* One design canvas (1920x1080), scaled by a single transform to fit the real WebView.
   No external fonts: Android TV always has a serif and sans-serif system font, so startup never waits on the network. */
:root{
  --red:#d9272e;--text:#f1f2f0;--mute:#aeb4b5;
  --serif:'Cinzel','Trajan Pro','Times New Roman',Georgia,serif;
  --sans:Roboto,'Segoe UI',Arial,sans-serif;
  --row-h:226px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#030405;color:var(--text);font-family:var(--sans);cursor:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#vp{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center}
#app{position:absolute;inset:0;overflow:hidden;background:#05070a}
.hidden{display:none!important}

/* ---------- wallpaper (static; no clones, no drift, no grain) ---------- */
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .8s ease}
.scene.on{opacity:1}
.glow{position:absolute;inset:0}
.scene img{position:absolute;display:block}
img.amb{inset:0;width:1920px;height:1080px;object-fit:cover;filter:brightness(.85) saturate(1.3)}
img.main{right:0;top:0;width:1320px;height:1080px;object-fit:cover;object-position:var(--px,40%) 18%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%)}
img.full{left:0;top:0;width:1920px;height:1080px;object-fit:cover}
img.band{right:0;top:0;width:1820px;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24%);mask-image:linear-gradient(90deg,transparent 0,#000 24%)}
img.poster{right:150px;top:0;height:1080px;width:auto;-webkit-mask-image:radial-gradient(ellipse 50% 56% at 50% 50%,#000 42%,transparent 100%);mask-image:radial-gradient(ellipse 50% 56% at 50% 50%,#000 42%,transparent 100%)}
img.cut{right:190px;bottom:0;height:1030px;width:auto}
.scrim{position:absolute;inset:0;z-index:4;pointer-events:none;background:
 linear-gradient(90deg,rgba(5,6,7,.93) 0,rgba(5,6,7,.66) 560px,transparent 1060px),
 linear-gradient(0deg,rgba(5,6,7,.96) 0,rgba(5,6,7,.72) 300px,transparent 560px),
 linear-gradient(180deg,rgba(5,6,7,.65),transparent 170px)}

/* ---------- header ---------- */
.top{position:absolute;z-index:7;top:56px;left:96px;right:96px;display:flex;align-items:center}
.emblem{width:62px;height:auto;margin-right:56px;filter:drop-shadow(0 0 10px rgba(255,255,255,.25))}
.tabs{display:flex;gap:54px}
.tab{appearance:none;background:none;border:0;position:relative;padding:10px 4px;font:500 24px var(--sans);letter-spacing:.16em;color:var(--mute);outline:none;cursor:none}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;border-radius:2px;background:var(--red);transform:scaleX(0)}
.tab.active{color:#fff}.tab.active::after{transform:scaleX(1)}
.tab:focus{color:#fff}
.tab:focus::after{transform:scaleX(1)}
.status{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:28px;font-weight:500;letter-spacing:.04em}
.status svg{width:36px;height:auto}

/* ---------- home ---------- */
#home{position:absolute;inset:0;z-index:6}
.hero{position:absolute;left:96px;top:168px;width:900px}
.hero.in{animation:fadeUp .6s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.jp{font-family:var(--serif);font-size:22px;letter-spacing:.7em;color:var(--mute);margin-bottom:14px}
.h1,.h2{font:800 90px/1.04 var(--serif);letter-spacing:.012em;white-space:nowrap}
.h1{color:#f4f2ee;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.h2{color:#e0353a}
.sub{margin-top:22px;font:500 25px var(--serif);letter-spacing:.5em;text-transform:uppercase}
.tag{margin-top:26px;display:flex;align-items:center;gap:24px;font:500 20px/1.9 var(--serif);letter-spacing:.3em;text-transform:uppercase;color:#cfd3d1;max-width:700px}
.tag::before{content:"";flex:none;width:76px;height:1px;background:#8a9091}

.lower{position:absolute;left:78px;right:82px;bottom:60px}
.label{font-size:30px;font-weight:600;margin-bottom:18px;padding-left:18px}
.dock{display:grid;grid-template-columns:repeat(6,232px);column-gap:26px;padding-left:18px;min-height:226px}

/* ---------- app tiles (shared by dock and grid) ---------- */
.tile{appearance:none;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;display:block;width:232px;text-align:center;outline:none;cursor:none;transition:transform .18s ease-out}
.tile .face{position:relative;overflow:hidden;display:grid;place-items:center;height:136px;margin-bottom:16px;border-radius:18px;border:2px solid rgba(255,255,255,.14);background:linear-gradient(150deg,#1e2124,#0c0e10)}
.tile img{width:88px;height:88px;object-fit:contain;display:block}
.tile .letter{font:800 56px/1 var(--serif);color:#e8eaea}
.tile .name{display:block;height:34px;line-height:34px;padding:0 6px;font-size:24px;font-weight:500;color:#e9ebe9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:focus{transform:translateY(-8px) scale(1.05)}
.tile:focus .face{border-color:var(--red);box-shadow:0 0 0 2px rgba(217,39,46,.35),0 14px 28px rgba(0,0,0,.55)}
.tile:focus .name{color:#fff}
.tile:focus .face::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:sheen .8s ease-out 1 forwards}
@keyframes sheen{to{left:130%}}
.dots{display:grid;grid-template-columns:repeat(3,14px);gap:10px}
.dots i{display:block;width:14px;height:14px;border-radius:50%;background:#d8dcdb}

/* ---------- empty / loading states ---------- */
.empty{grid-column:1/-1;display:flex;align-items:center;gap:26px;color:var(--mute);font-size:24px;padding:20px 0}
.retry{appearance:none;cursor:none;border:2px solid rgba(255,255,255,.3);background:rgba(10,12,13,.75);color:#fff;font:600 24px var(--sans);padding:12px 28px;border-radius:12px;outline:none}
.retry:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(217,39,46,.35)}

/* ---------- all apps ---------- */
#allapps{position:absolute;inset:0;z-index:6}
.allhead{position:absolute;left:96px;right:96px;top:168px;display:flex;align-items:baseline;gap:24px}
.allhead .label{margin:0;padding:0;font:800 60px var(--serif);letter-spacing:.02em}
.count{font-size:24px;color:var(--mute)}
.gridwrap{position:absolute;left:96px;right:96px;top:300px;bottom:40px;overflow:hidden;padding:20px}
.grid{position:relative;display:grid;grid-template-columns:repeat(6,232px);column-gap:26px;row-gap:40px;transition:transform .2s ease-out}
.grid .empty{grid-column:1/-1}
</style>
</head>
<body>
<div id="vp"><div id="app">
  <div id="scenes"></div>
  <div class="scrim"></div>

  <header class="top">
    <svg class="emblem" viewBox="0 0 64 74" aria-hidden="true">
      <path d="M32 2 4 12v26c0 17 12 28 28 34 16-6 28-17 28-34V12z" fill="rgba(10,12,13,.7)" stroke="#d6dadb" stroke-width="2.5"/>
      <g fill="#e6e9ea"><path d="M31 22C24 20 14 16 8 10c1 12 9 20 23 22z"/><path d="M31 33C25 33 17 32 11 28c5 8 12 12 20 12z" opacity=".75"/><path d="M31 44C26 45 20 44 15 41c4 7 10 10 16 10z" opacity=".55"/></g>
      <g fill="#b9bfc1"><path d="M33 22c7-2 17-6 23-12-1 12-9 20-23 22z"/><path d="M33 33c6 0 14-1 20-5-5 8-12 12-20 12z" opacity=".75"/><path d="M33 44c5 1 11 0 16-3-4 7-10 10-16 10z" opacity=".55"/></g>
    </svg>
    <nav class="tabs">
      <button class="tab active" data-view="home">HOME</button>
      <button class="tab" data-view="all">ALL APPS</button>
      <button class="tab" data-action="settings">SETTINGS</button>
    </nav>
    <div class="status">
      <svg viewBox="0 0 24 18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M2 6.5a14 14 0 0 1 20 0"/><path d="M5.5 10.2a9 9 0 0 1 13 0"/><path d="M9 13.8a4 4 0 0 1 6 0"/><circle cx="12" cy="16.5" r=".9" fill="#fff"/></svg>
      <span id="clock"></span>
    </div>
  </header>

  <section id="home" class="view">
    <div class="hero" id="hero">
      <div class="jp">進 撃 の 巨 人</div><div class="h1" id="h1"></div><div class="h2" id="h2"></div><div class="sub" id="sub"></div><div class="tag" id="tag"></div>
    </div>
    <div class="lower">
      <div class="label">Favourites</div>
      <div class="dock" id="dock"><div class="empty"><p>Finding your apps…</p></div></div>
    </div>
  </section>

  <section id="allapps" class="view hidden">
    <div class="allhead"><span class="label">All Apps</span><span class="count" id="count"></span></div>
    <div class="gridwrap"><div class="grid" id="grid"><div class="empty"><p>Finding your apps…</p></div></div></div>
  </section>
</div></div>

<script>
/* ================= SETTINGS ================= */
const ROTATE_MS = 0;   // 0 = one stable wallpaper. Set e.g. 120000 for a slow crossfade every 2 minutes.
const HOME_MAX  = 5;   // favourite apps on Home (the 6th tile is "All Apps")
const GRID_COLS = 6;
const ROW_H     = 226; // must match .grid row height (tile + label + row-gap)

/* ================= WALLPAPERS (bundled files, decoded only when shown) ================= */
const SCENES=[
 {k:'main', src:'wallpapers/a.webp', px:'40%', glow:'#4a2a18', l1:"HUMANITY'S", l2:'STRONGEST', sub:'Captain Levi Ackerman', tag:'A clean world begins with difficult choices.'},
 {k:'full', src:'wallpapers/e.webp', glow:'#3a1d0c', l1:'STEADY HANDS', l2:'SHARP BLADES', sub:"Humanity's strongest soldier", tag:'Spotless. Always.'},
 {k:'band', src:'wallpapers/b.webp', amb:'wallpapers/bAmb.webp', glow:'#0d1520', l1:'SURVIVE', l2:'TOMORROW', sub:'Captain Levi Ackerman', tag:'Clean today. Survive tomorrow.'},
 {k:'poster', src:'wallpapers/f.webp', glow:'#243029', l1:'TWIN BLADES', l2:'ONE CAPTAIN', sub:'Survey Corps', tag:'Steady hands. Sharp blades.'},
 {k:'band', src:'wallpapers/c.webp', amb:'wallpapers/cAmb.webp', glow:'#2a160c', l1:'ATTACK ON', l2:'TITAN', sub:'Captain Levi Ackerman', tag:"Some choices don't come with a good ending."},
 {k:'cut', src:'wallpapers/g.webp', glow:'#243f2e', l1:'DEDICATE', l2:'YOUR HEART', sub:'Special Operations Squad', tag:'Every second counts.'},
 {k:'band', src:'wallpapers/d.webp', amb:'wallpapers/dAmb.webp', glow:'#2a1a10', l1:'LEVI', l2:'ACKERMAN', sub:'Captain', tag:'No regrets. Only results.'}
];

/* ================= BRIDGE + STATE ================= */
const bridge = window.Levi || null;     // provided by MainActivity; null when opened in a desktop browser
const $ = s => document.querySelector(s);
const vp=$('#vp'), stage=$('#scenes'), hero=$('#hero'), homeEl=$('#home'), allEl=$('#allapps');
const dock=$('#dock'), grid=$('#grid'), countEl=$('#count');
const tabs=[...document.querySelectorAll('.tab')];
let view="home", apps=[], cur=-1, lastFocus=null;

/* ================= STAGE FIT (single scaling step) ================= */
const OVERSCAN_SCALE=0.96;
function fit(){
  const w=window.innerWidth||document.documentElement.clientWidth||1920;
  const h=window.innerHeight||document.documentElement.clientHeight||1080;
  const s=Math.min(w/1920, h/1080)*OVERSCAN_SCALE;
  vp.style.transform='translate(-50%,-50%) scale('+s+')';
}
fit(); addEventListener('resize', fit); addEventListener('orientationchange', fit); addEventListener('load', fit);
if(window.visualViewport) visualViewport.addEventListener('resize', fit); setTimeout(fit, 100);

/* ================= WALLPAPER ================= */
function makeScene(s){
  const d=document.createElement('div'); d.className='scene';
  const g=document.createElement('div'); g.className='glow';
  g.style.background='radial-gradient(60% 90% at 72% 45%,'+s.glow+' 0%,#07090a 72%)';
  d.appendChild(g);
  if(s.amb){ const a=new Image(); a.className='amb'; a.decoding='async'; a.alt=''; a.src=s.amb; d.appendChild(a); }
  const i=new Image(); i.className=s.k; i.decoding='async'; i.alt=''; i.src=s.src;
  if(s.px) i.style.setProperty('--px', s.px);
  d.appendChild(i);
  return d;
}
function showScene(i){
  if(i===cur) return;
  const old=stage.querySelector('.scene.on');
  const d=makeScene(SCENES[i]);
  stage.appendChild(d);
  void d.offsetWidth;            // commit the starting style so the opacity transition runs
  d.classList.add('on');
  if(old){ old.classList.remove('on'); setTimeout(()=>old.remove(), 900); }
  cur=i;
  setText(SCENES[i]);
}
function setText(s){
  $('#h1').textContent=s.l1; $('#h2').textContent=s.l2; $('#sub').textContent=s.sub; $('#tag').textContent=s.tag;
  hero.classList.remove('in'); void hero.offsetWidth; hero.classList.add('in');
}
let rot=null;
function startRotation(){ if(ROTATE_MS>0 && !rot) rot=setInterval(()=>showScene((cur+1)%SCENES.length), ROTATE_MS); }
function stopRotation(){ clearInterval(rot); rot=null; }
document.addEventListener('visibilitychange', ()=> document.hidden ? stopRotation() : startRotation());

/* ================= CLOCK (one timer, 30 s resolution) ================= */
function tick(){ $('#clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }
tick(); setInterval(tick, 30000);

/* ================= VIEWS ================= */
function setView(v){
  view=v;
  homeEl.classList.toggle('hidden', v!=='home');
  allEl.classList.toggle('hidden', v!=='all');
  tabs.forEach(t=>t.classList.toggle('active', t.dataset.view===v));
}
function focusFirst(container){
  const b=container.querySelector('button');
  if(b){ b.focus({preventScroll:true}); return true; }
  return false;
}
function openView(v){
  setView(v);
  if(!(v==='home' ? focusFirst(dock) : focusFirst(grid))) tabs[0].focus({preventScroll:true});
}
function focusHome(){
  setView('home');
  const keep = lastFocus && lastFocus.isConnected && homeEl.contains(lastFocus);
  if(keep) lastFocus.focus({preventScroll:true});
  else if(!focusFirst(dock)) tabs[0].focus({preventScroll:true});
}

/* ================= TILES (text is set with textContent, never HTML) ================= */
function appTile(a){
  const b=document.createElement('button');
  b.className='tile'; b.dataset.pkg=a.pkg;
  const face=document.createElement('span'); face.className='face';
  if(a.icon){ const im=new Image(); im.alt=''; im.decoding='async'; im.src=a.icon; face.appendChild(im); }
  else { const l=document.createElement('span'); l.className='letter'; l.textContent=(a.label||'?').charAt(0).toUpperCase(); face.appendChild(l); }
  const n=document.createElement('span'); n.className='name'; n.textContent=a.label;
  b.append(face,n);
  b.addEventListener('click', ()=>{ if(bridge) bridge.open(a.pkg); });
  return b;
}
function allTile(){
  const b=document.createElement('button');
  b.className='tile'; b.dataset.allapps='1';
  const face=document.createElement('span'); face.className='face';
  const dots=document.createElement('span'); dots.className='dots';
  for(let k=0;k<9;k++) dots.appendChild(document.createElement('i'));
  face.appendChild(dots);
  const n=document.createElement('span'); n.className='name'; n.textContent='All Apps';
  b.append(face,n);
  b.addEventListener('click', ()=>openView('all'));
  return b;
}
function emptyBlock(message, withRetry){
  const d=document.createElement('div'); d.className='empty';
  const p=document.createElement('p'); p.textContent=message; d.appendChild(p);
  if(withRetry){
    const r=document.createElement('button'); r.className='retry'; r.textContent='Retry';
    r.addEventListener('click', ()=>{ p.textContent='Finding your apps…'; r.remove(); if(bridge) bridge.refresh(); });
    d.appendChild(r);
  }
  return d;
}

/* ================= RENDER (called by MainActivity after discovery) ================= */
function renderApps(data){
  const list=Array.isArray(data.apps)?data.apps:[];
  apps=list;
  const active=document.activeElement;
  const activePkg=active && active.dataset ? active.dataset.pkg : null;
  const wasOnTab=active && tabs.includes(active);
  const message = data.error ? 'Could not read the apps installed on this TV.' : 'No launchable apps were found on this TV.';

  dock.textContent='';
  if(!list.length) dock.appendChild(emptyBlock(message, true));
  else { list.slice(0,HOME_MAX).forEach(a=>dock.appendChild(appTile(a))); dock.appendChild(allTile()); }

  grid.textContent='';
  grid.style.transform='';
  if(!list.length) grid.appendChild(emptyBlock(message, true));
  else list.forEach(a=>grid.appendChild(appTile(a)));
  countEl.textContent = list.length ? list.length+(list.length===1?' app':' apps') : '';

  // Focus rules after a re-render:
  //  - the user is on the top navigation: leave focus alone;
  //  - the same app still exists: keep focus on it;
  //  - focus was lost (element removed or first load): focus the first visible item.
  if(wasOnTab) return;
  const inView = view==='home' ? dock : grid;
  const same = activePkg && [...inView.querySelectorAll('[data-pkg]')].find(el=>el.dataset.pkg===activePkg);
  if(same) same.focus({preventScroll:true});
  else if(!active || active===document.body || !document.contains(active)) focusFirst(inView);
}
window.leviSetApps=function(json){
  let data;
  try { data=JSON.parse(json); } catch(e){ data={apps:[], error:'parse'}; }
  renderApps(data);
};

/* ================= BACK / HOME hooks (called by MainActivity) ================= */
window.leviBack=function(){
  if(view!=='home'){ focusHome(); return true; }
  return false;               // already on Home: nothing to do, the launcher never exits
};
window.leviHome=function(){ focusHome(); };

/* ================= D-PAD NAVIGATION (2-D over the rows that are visible) ================= */
function rows(){
  const r=[tabs];
  if(view==='home'){
    r.push([...dock.querySelectorAll('button')]);
  } else {
    const b=[...grid.querySelectorAll('button')];
    for(let i=0;i<b.length;i+=GRID_COLS) r.push(b.slice(i,i+GRID_COLS));
  }
  return r.filter(x=>x.length);
}
const MOVES={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};
addEventListener('keydown', e=>{
  const mv=MOVES[e.key];
  if(!mv) return;
  e.preventDefault();
  const R=rows();
  let r=-1,c=-1;
  R.forEach((row,ri)=>{ const ci=row.indexOf(document.activeElement); if(ci>=0){ r=ri; c=ci; } });
  if(r<0){ R[0][0].focus({preventScroll:true}); return; }
  const nr=Math.min(Math.max(r+mv[0],0),R.length-1);
  let nc=Math.min(Math.max(c+mv[1],0),R[nr].length-1);
  if(mv[0]===-1 && nr===0) nc=Math.max(0, tabs.findIndex(t=>t.dataset.view===view));  // Up returns to the active tab
  if(mv[0]===1 && r===0) nc=0;                                                       // Down from the tabs enters the content at its start
  if(nr!==r || nc!==c) R[nr][nc].focus({preventScroll:true});
});

/* Track the last thing focused on Home, so pressing Home returns the user to it. */
document.addEventListener('focusin', e=>{
  const t=e.target;
  if(t && t.tagName==='BUTTON'){
    lastFocus=t;
    if(grid.contains(t)){                     // keep the focused row inside the visible window
      grid.style.transform='translateY('+(-Math.max(0, t.offsetTop-ROW_H))+'px)';
    }
  }
});

/* Tabs */
tabs.forEach(t=>t.addEventListener('click', ()=>{
  if(t.dataset.view==='home') openView('home');
  else if(t.dataset.view==='all') openView('all');
  else if(t.dataset.action==='settings' && bridge) bridge.openSettings();
}));

/* ================= START ================= */
setView('home');
showScene(0);
startRotation();
</script>
</body>
</html>
